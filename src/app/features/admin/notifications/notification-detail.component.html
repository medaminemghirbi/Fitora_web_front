<div class="fx-page">
  <a routerLink="/admin/notifications" class="notif-detail-back">
    <i class="bi bi-chevron-left"></i> {{ "notifications.detail_back" | translate }}
  </a>

  @if (loading()) {
    <div class="d-flex justify-content-center py-5"><app-spinner [size]="32" /></div>
  } @else if (error() || !notification()) {
    <div class="app-card"><div class="app-card-body"><app-error-state (retry)="load()" /></div></div>
  } @else if (notification()) {
    @if (notification(); as n) {
    <div class="app-card notif-detail-card">
      <div class="app-card-body">
        <app-notification-art [kind]="n.kind" />
        <h1>{{ text().title }}</h1>
        <p class="notif-detail-body">{{ text().body }}</p>
        <p class="notif-detail-date">{{ n.created_at | date: "EEEE d MMMM y, HH:mm" }}</p>

        <a [routerLink]="[n.url]" class="btn btn-primary notif-detail-cta">
          {{ ctaKey() | translate }}
          <i class="bi bi-arrow-right"></i>
        </a>
      </div>
    </div>
    }
  }
</div>
