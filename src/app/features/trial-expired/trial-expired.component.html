<div class="trial-expired-page">
  <div class="trial-expired-card">
    <div class="trial-expired-icon">🔒</div>

    @if (auth.currentUser()?.role === "owner") {
      <h1>{{ "trial.owner_title" | translate }}</h1>
      <p class="trial-expired-body">{{ "trial.owner_body" | translate }}</p>
      <p class="trial-expired-hint">{{ "trial.owner_hint" | translate }}</p>
    } @else {
      <h1>{{ "trial.staff_title" | translate }}</h1>
      <p class="trial-expired-body">{{ "trial.staff_body" | translate }}</p>
    }

    <button type="button" class="btn btn-outline-secondary" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> {{ "auth.logout" | translate }}
    </button>
  </div>
</div>
