@if (preparing()) {
  <div class="prep">
    <div class="prep-scene" aria-hidden="true">
      <span class="prep-orbit prep-orbit--1"></span>
      <span class="prep-orbit prep-orbit--2"></span>
      <div class="prep-window">
        <div class="prep-bar">
          <span></span><span></span><span></span>
        </div>
        <div class="prep-body">
          <div class="prep-side">
            <i></i><i></i><i></i><i></i>
          </div>
          <div class="prep-main">
            <div class="prep-block b1"></div>
            <div class="prep-block b2"></div>
            <div class="prep-block b3"></div>
            <div class="prep-block b4"></div>
            <div class="prep-block b5"></div>
          </div>
        </div>
      </div>
      <svg class="prep-gear" viewBox="0 0 24 24" fill="none">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.6" />
        <path d="M12 2v3m0 14v3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </div>

    <h1 class="prep-title">{{ "onboarding.prep_title" | translate }}</h1>
    <p class="prep-step">{{ prepSteps[prepStep()] | translate }}</p>

    <div class="prep-progress"><span></span></div>
  </div>
} @else {
<div class="auth-page">
  <div class="auth-card setup-card">
    <div class="auth-brand">FITORA</div>
    <p class="auth-tagline">{{ "app.tagline" | translate }}</p>

    <h1>{{ "onboarding.details_title" | translate }}</h1>
    <p class="text-muted-token small mb-3">{{ "onboarding.subtitle" | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (error()) {
        <div class="alert alert-danger" role="alert">{{ error() }}</div>
      }

      <div class="mb-3">
        <label for="org-name">{{ "locations.name" | translate }} *</label>
        <input id="org-name" class="form-control" formControlName="name" />
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label for="org-city">{{ "locations.city" | translate }}</label>
          <input id="org-city" class="form-control" formControlName="city" />
        </div>
        <div class="col-6 mb-3">
          <label for="org-country">{{ "onboarding.country" | translate }}</label>
          <app-searchable-select id="org-country" formControlName="country"
                                 [options]="countryOptions" [placeholder]="'onboarding.select_country' | translate" />
        </div>
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label for="org-phone">{{ "auth.phone" | translate }}</label>
          <input id="org-phone" class="form-control" formControlName="phone" />
        </div>
        <div class="col-6 mb-3">
          <label for="org-email">{{ "auth.email" | translate }}</label>
          <input id="org-email" type="email" class="form-control" formControlName="email" />
        </div>
      </div>

      <div class="mb-3">
        <label for="org-address">{{ "onboarding.gym_address" | translate }}</label>
        <input id="org-address" class="form-control" formControlName="address" [placeholder]="'onboarding.gym_address_hint' | translate" />
      </div>

      <div class="row">
        <div class="col-6 mb-3">
          <label for="org-timezone">{{ "onboarding.timezone" | translate }} *</label>
          <select id="org-timezone" class="form-select" formControlName="timezone">
            @for (group of timezoneGroups; track group.region) {
              <optgroup [label]="group.region">
                @for (z of group.zones; track z.value) {
                  <option [value]="z.value">{{ z.label }}</option>
                }
              </optgroup>
            }
          </select>
        </div>
        <div class="col-6 mb-3">
          <label for="org-currency">{{ "onboarding.currency" | translate }} *</label>
          <select id="org-currency" class="form-select" formControlName="currency">
            @for (c of currencies; track c.code) {
              <option [value]="c.code">{{ ("currency." + c.code) | translate }} — {{ c.symbol }} ({{ c.code }})</option>
            }
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="saving()">
        @if (saving()) {
          <app-spinner [size]="16" />
        } @else {
          {{ "onboarding.create" | translate }}
        }
      </button>
    </form>
  </div>
</div>
}
