<div class="locked-page">
  <div class="locked-card">
    <div class="locked-icon">🔒</div>

    @if (isOwner()) {
      <h1>{{ ("locked.title_" + reason()) | translate }}</h1>
      <p class="locked-body">{{ ("locked.body_" + reason()) | translate }}</p>

      <a routerLink="/owner/subscription" class="btn btn-primary">{{ "locked.see_invoices" | translate }}</a>

      <p class="locked-hint">{{ "locked.hint" | translate }}</p>
    } @else {
      <h1>{{ "locked.staff_title" | translate }}</h1>
      <p class="locked-body">{{ "locked.staff_body" | translate }}</p>
    }

    <button type="button" class="btn btn-ghost locked-out" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i> {{ "auth.logout" | translate }}
    </button>
  </div>
</div>
