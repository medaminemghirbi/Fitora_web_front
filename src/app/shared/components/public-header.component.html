<header class="pub-header">
  <div class="pub-shell">
    <a routerLink="/" class="pub-brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
      fitora
    </a>

    <nav class="pub-nav" [attr.aria-label]="'nav.primary' | translate">
      <a routerLink="/gyms" routerLinkActive="is-active" class="pub-nav-explore">
        <i class="bi bi-compass"></i>
        {{ "public.nav.explore" | translate }}
      </a>
      <a routerLink="/pro" class="pub-nav-link">{{ "public.nav.for_gyms" | translate }}</a>
    </nav>

    <a routerLink="/connexion" class="pub-nav-link pub-hide-sm">{{ "auth.login" | translate }}</a>
    <a routerLink="/inscription" class="pub-cta">{{ "public.nav.create_account" | translate }}</a>

    <button type="button" class="pub-burger" (click)="mobileOpen.set(!mobileOpen())"
            [attr.aria-expanded]="mobileOpen()" [attr.aria-label]="'common.toggle_menu' | translate">
      <i class="bi" [class.bi-list]="!mobileOpen()" [class.bi-x-lg]="mobileOpen()"></i>
    </button>
  </div>

  @if (mobileOpen()) {
    <div class="pub-mobile">
      <a routerLink="/gyms" (click)="mobileOpen.set(false)">{{ "public.nav.explore" | translate }}</a>
      <a routerLink="/pro" (click)="mobileOpen.set(false)">{{ "public.nav.for_gyms" | translate }}</a>
      <a routerLink="/connexion" (click)="mobileOpen.set(false)">{{ "auth.login" | translate }}</a>
    </div>
  }
</header>
