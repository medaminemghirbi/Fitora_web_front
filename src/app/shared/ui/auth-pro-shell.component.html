<div class="apro">
  <header class="apro-bar">
    <a routerLink="/" class="apro-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
      fitora
    </a>
    @if (asideLinkText) {
      <span class="apro-aside">
        {{ asideText }}
        <a [routerLink]="asideLink">{{ asideLinkText }}</a>
      </span>
    }
  </header>

  <main class="apro-main">
    <div class="apro-col" [class.is-wide]="wide">
      <span class="apro-eyebrow">{{ "auth.pro_space" | translate }}</span>
      <ng-content></ng-content>
    </div>
  </main>
</div>
