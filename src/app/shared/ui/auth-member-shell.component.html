<div class="amem">
  <span class="amem-glow" aria-hidden="true"></span>

  <header class="amem-bar">
    <a routerLink="/" class="amem-brand">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
      fitora
    </a>
    <a routerLink="/pro" class="amem-aside">{{ "auth.member_shell_pro_link" | translate }}</a>
  </header>

  <main class="amem-main">
    <div class="amem-col" [class.is-wide]="wide">
      @if (pitch) {
        <p class="amem-pitch" aria-hidden="true">{{ pitch }}</p>
      }
      <div class="amem-card">
        <ng-content></ng-content>
      </div>
    </div>
  </main>
</div>
