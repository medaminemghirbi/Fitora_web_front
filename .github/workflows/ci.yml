name: CI

# This repo is the frontend only — backend and mobile are separate
# repositories with their own history and CI.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build (production)
        run: npx ng build --configuration production
