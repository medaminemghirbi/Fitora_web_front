name: CI

# Frontend only. backend/ is no longer part of this repo — it has its own
# independent git history and CI (backend/.git, remote fitora_backend).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Build (production)
        run: npx ng build --configuration production
